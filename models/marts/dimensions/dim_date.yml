version: 2

models:
  - name: dim_date
    description: "Calendar date dimension used for ride-sharing analytics."

    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique

      - name: full_date
        data_tests:
          - not_null
          - unique

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null