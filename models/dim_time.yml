version: 2

models:
  - name: dim_time
    description: "Time dimension at 5-minute interval grain."

    columns:
      - name: time_key
        data_tests:
          - not_null
          - unique

      - name: time_slot
        data_tests:
          - not_null
          - unique

      - name: hour
        data_tests:
          - not_null

      - name: minute
        data_tests:
          - not_null